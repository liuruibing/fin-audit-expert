version: '3.8'

services:
  # 金融审核专家后端与 Harness 核心服务
  finaudit-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finaudit-expert-server
    restart: always
    ports:
      - "8080:8080"
    environment:
      - LLM_API_BASE=http://vllm-service:8000/v1
      - LLM_API_KEY=EMPTY
      - LLM_MODEL_NAME=Qwen2.5-32B-Instruct-AWQ
    volumes:
      - ./backend/data:/app/backend/data
    depends_on:
      - vllm-service

  # 私有化本地大模型推理服务 (vLLM)
  vllm-service:
    image: vllm/vllm-openai:latest
    container_name: finaudit-vllm
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=""
    command: >
      --model Qwen/Qwen2.5-32B-Instruct-AWQ
      --quantization awq
      --dtype auto
      --max-model-len 32768
      --gpu-memory-utilization 0.90
      --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 结构化存储数据库
  postgres:
    image: postgres:15-alpine
    container_name: finaudit-postgres
    restart: always
    environment:
      POSTGRES_DB: finaudit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: auditpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
